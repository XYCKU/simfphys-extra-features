name: GMod runtime

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmod-runtime
  cancel-in-progress: false

jobs:
  gmod-runtime:
    name: GMod compile and server tests
    if: vars.GMOD_RUNTIME_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Run dedicated-server checks
        run: bash scripts/run-gmod-tests-docker.sh

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gmod-server-logs
          path: artifacts/gmod-tests.log
          if-no-files-found: ignore
